; ddmod.ini - default configuration
; Every feature can be switched off individually (1 = on, 0 = off).

[General]
; Log detail written to ddmod.log: debug, info, warn, error, off
LogLevel=info

[Features]
; Input hook for ddmod's hotkeys ([Keys]). Keys ddmod does not use reach the game unchanged.
InputHook=1

[Keys]
; Syntax: optional modifiers Ctrl, Shift, Alt joined with '+', then one key, e.g. Ctrl+Shift+F10.
; Keys: A-Z, 0-9, F1-F24, Num0-Num9, NumAdd, NumSub, NumMul, NumDiv, NumDecimal, Space, Enter,
; Escape, Tab, Backspace, Insert, Delete, Home, End, PageUp, PageDown, Up, Down, Left, Right,
; Pause, ScrollLock. Modifiers must match exactly. Empty or None = not bound.
; Avoid the game's own keys (Ctrl+F11, Ctrl+F12, Ctrl+L, Ctrl+S, letters, Space) and Steam's F12.
; Writes a line to ddmod.log - checks that the input hook works.
TestHotkey=Ctrl+Shift+F10
