; ddmod.ini - default configuration
; Every feature can be switched off individually (1 = on, 0 = off).

[General]
; Log detail written to ddmod.log: debug, info, warn, error, off
LogLevel=info

[Features]
; Input hook for ddmod's hotkeys ([Keys]). Keys ddmod does not use reach the game unchanged.
InputHook=1
; Overlay in the top-left corner ("ddmod <version> active" + FPS). Direct3D renderer only.
Overlay=1

[Overlay]
; Show the frame rate below the status line.
ShowFps=1
; Font for the overlay text. FontFile (optional, relative to this folder) is loaded for the game
; process only; FontFace must then name a face in that file. Empty FontFile = installed font.
FontFace=Tahoma
FontFile=
; Character height in pixels; 0 = from the resolution (height / 60, 12 to 48).
FontSize=0

[Keys]
; Syntax: optional modifiers Ctrl, Shift, Alt joined with '+', then one key, e.g. Ctrl+Shift+F3.
; Keys: A-Z, 0-9, F1-F24, Num0-Num9, NumAdd, NumSub, NumMul, NumDiv, NumDecimal, Space, Enter,
; Escape, Tab, Backspace, Insert, Delete, Home, End, PageUp, PageDown, Up, Down, Left, Right,
; Pause, ScrollLock. Modifiers must match exactly. Empty or None = not bound.
; Avoid the game's own keys (Ctrl+F11, Ctrl+F12, Ctrl+L, Ctrl+S, letters, Space), Steam's F12, and F10/Alt
; combinations (Windows opens the system menu on them if the hook does not get the key).
; Writes a line to ddmod.log - checks that the input hook works.
TestHotkey=Ctrl+Shift+F3
