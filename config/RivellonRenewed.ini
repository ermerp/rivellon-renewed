; RivellonRenewed.ini - default configuration of Rivellon Renewed
; Every feature can be switched off individually (1 = on, 0 = off).

[General]
; Log detail written to RivellonRenewed.log: debug, info, warn, error, off
LogLevel=info
; RivellonRenewed.log is the current start, RivellonRenewed.prev.log the one before. Older logs
; are kept in the folder RivellonRenewed\logs, named by start time
; (RivellonRenewed-YYYYMMDD-HHMMSS.log); how many: 0 = none.
LogHistory=20

[Features]
; Input hook for the mod's hotkeys ([Keys]). Keys the mod does not use reach the game unchanged.
InputHook=1
; Overlay in the top-left corner ("Rivellon Renewed <version> active", optionally the frame rate).
; Direct3D renderer only.
Overlay=1
; Game texts in scalable fonts instead of the game's bitmap letters ([Fonts] Renderer chooses
; how). 0 = original bitmap fonts.
; Russian edition (1.0061): not supported, it keeps its original (Cyrillic) bitmap fonts.
FontHook=1
; Ground fog: 1 = on (even if config.div says "no fog", as Steam ships it), 0 = off, keep = as
; config.div says. Switching fog in the game's picture settings changes this value when the game
; exits.
Fog=1

[Movement]
; Holding the left mouse button: the hero walks while the cursor is within this many pixels of
; the screen center and runs beyond. The game uses 3/8 of the screen height, which grows with the
; resolution (405 px at 1920x1080); a fixed radius keeps the same distance in the world at every
; resolution (225 = the game at 800x600). original = the game's circle. [Keys] CycleWalkRadius
; tries values in game.
WalkRadius=225
; A double click on the ground makes the hero run there (a single click walks, as in the game;
; the game's Always Run key still runs on every click). 0 = off. Needs [Features] InputHook=1.
DoubleClickRun=1

[Overlay]
; Status line "Rivellon Renewed <version> active": banner = for BannerSeconds after the game
; starts drawing, then hidden; always = all the time; off = never.
Status=banner
; How long the banner stays, in seconds (1-60).
BannerSeconds=5
; Look of the status line: game = "Rivellon Renewed" in the main menu's face, the version and
; "active" in the load dialog's (measured from the game's own fonts in its fonts folder); plain =
; one line in the font chain's face ([Fonts] Chain).
BannerLook=game
; Show the frame rate at start (1 = on). Switch it on and off in game with [Keys] ToggleFps.
; Known issue: while it is shown, it can appear in the preview picture of a save.
ShowFps=0
; Character height of the FPS line and the plain status line in pixels; 0 = from the
; resolution (height / 60, 12 to 48).
FontSize=0

[Fonts]
; How the game's texts are drawn with FontHook=1:
;   glyphs = the game's own fonts get new letters, each text family in its own face and style
;            ([Family.*] below); books and letters can get a larger line height (pages re-flow).
;   gdi    = the game's Windows-font path (as "use8bitfont 0" would, config.lcl stays unchanged)
;            with the font chain below for every text; GameFontSize, Colors and Charset apply.
Renderer=glyphs
; Font chain for the overlay and, with Renderer=gdi, for the game's texts: entries
; separated by ',', tried in order; the first face
; that is really available is used (RivellonRenewed.log names it). "Face" = installed font;
; "Face @ file" = font file (relative to this folder) loaded for the game process only.
; Default: Tahoma (Windows; Proton brings its own), else the bundled DejaVu Sans Condensed Bold.
Chain=Tahoma, DejaVu Sans Condensed @ RivellonRenewed\fonts\DejaVuSansCondensed-Bold.ttf
; Size of the game's texts in percent of the size the game asks for (Renderer=gdi, 50-300).
GameFontSize=100
; Letter spacing of the game's texts with FontHook=1 (both renderers): font (the font's own spacing), game (as the
; game spaces them - letters touch or overlap, a period after "1" merges with it) or gap (the
; game's spacing plus one pixel where letters touch - still overlaps at feet such as in "Li").
Spacing=font
; Text colors of the game's texts with Renderer=gdi: original (the colors of the game's bitmap fonts,
; e.g. gold dialog lines) or game (the game's own colors for Windows fonts, e.g. pure yellow).
Colors=original
; Code page of the game's texts for the Windows font (Renderer=gdi): auto, 1252 (Western) or 1251
; (Cyrillic). auto = 1251 for the Russian edition, otherwise as the game asks.
Charset=auto
; Menu labels too wide for the menu face (Renderer=glyphs) get a shorter text, so they do not
; run over the options pages' arrows: German "HINTERGRUNDGERAEUSCHE" (sound page) -> "HINTERGRUND".
; 0 = the game's texts.
ShortLabels=1

; Text families of Renderer=glyphs. Per family: Enabled (0 = the game's original letters),
; Face (font chain as in [Fonts] Chain; the first available face is used), Weight (100-900; 600
; and more also thickens faces that have only a regular cut), LineHeight (percent of the original
; line pitch, 50-300, or auto = high enough that letters of neighboring lines do not touch).
; Effects (menu and diary title only): 1 = gloss and texture / shaded edges like the originals,
; 0 = plain color. TopFit (menu and diary title only): the game cuts off anything above the top
; of these lines, so umlaut dots and accents move down close to their letter first; what still
; sticks out is handled by lowering the whole font (lower), by compressing the part above the
; capitals (squeeze) or by drawing such accents smaller and compressing only tall letters (fit,
; the text keeps its place); none = left as it is. Letters a face does not have keep the game's original
; letter.

[Family.Interface]
; Item tooltips, load/save dialog, character sheet, skills, trade.
Enabled=1
Face=Marcellus SC @ RivellonRenewed\fonts\MarcellusSC-Regular.ttf
Weight=600
LineHeight=100

[Family.Books]
; Letters, books, diary entries.
Enabled=1
Face=Fondamento @ RivellonRenewed\fonts\Fondamento-Regular.ttf
Weight=400
LineHeight=auto

[Family.Menu]
; Main-menu capitals.
Enabled=1
Face=Uncial Antiqua @ RivellonRenewed\fonts\UncialAntiqua-Regular.ttf
Weight=600
LineHeight=100
Effects=1
TopFit=lower
; Arrows beside the values on the options pages: own = own triangles in the original arrows'
; place and colors, original = the game's arrow glyphs.
Arrows=own

[Family.Dialog]
; NPC dialogs. Tahoma (Windows; Proton brings its own), else the bundled DejaVu Sans Condensed.
Enabled=1
Face=Tahoma, DejaVu Sans Condensed @ RivellonRenewed\fonts\DejaVuSansCondensed-Bold.ttf
Weight=700
LineHeight=100

[Family.DiaryTitle]
; Title of the diary pages.
Enabled=1
Face=Almendra SC @ RivellonRenewed\fonts\AlmendraSC-Regular.ttf
Weight=600
LineHeight=100
Effects=1
TopFit=lower

[DgVoodoo]
; dgVoodoo2's watermark (logo in the bottom corner; dgVoodoo ships with it on). The mod sets it in
; dgVoodoo.conf in this folder at every start: 0 = off, 1 = on (shows that dgVoodoo is active),
; keep = dgVoodoo.conf is not touched. Without dgVoodoo.conf (e.g. Steam Deck) nothing happens.
Watermark=0

[Keys]
; Syntax: optional modifiers Ctrl, Shift, Alt joined with '+', then one key, e.g. Ctrl+Shift+F3.
; Keys: A-Z, 0-9, F1-F24, Num0-Num9, NumAdd, NumSub, NumMul, NumDiv, NumDecimal, Space, Enter,
; Escape, Tab, Backspace, Insert, Delete, Home, End, PageUp, PageDown, Up, Down, Left, Right,
; Pause, ScrollLock. Modifiers must match exactly. Empty or None = not bound.
; Avoid the game's own keys (Ctrl+F11, Ctrl+F12, Ctrl+L, Ctrl+S, letters, Space), Steam's F12, and F10/Alt
; combinations (Windows opens the system menu on them if the hook does not get the key).
; Writes a line to RivellonRenewed.log - checks that the input hook works.
TestHotkey=Ctrl+Shift+F3
; Shows or hides the frame rate in the overlay.
ToggleFps=Ctrl+Shift+F2
; Test aid: the next walk radius ([Movement] WalkRadius: 125, 175, 225, 250, 275, 325, original),
; shown in the overlay for 3 seconds and saved into this file.
CycleWalkRadius=Ctrl+Shift+F4
